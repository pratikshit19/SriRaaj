<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B3A2A"/>
      <stop offset="100%" stop-color="#6B2A1C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square / Circle Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  
  <!-- Golden Ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.85"/>
  
  <!-- Stylized 3-Leaf Sprout (Pure Ghee & Oil Botanicals) -->
  <!-- Center Leaf -->
  <path d="M32 15 C33.5 22 36 26 32 37 C28 26 30.5 22 32 15 Z" fill="url(#gold)"/>
  <line x1="32" y1="18" x2="32" y2="36" stroke="#8B3A2A" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Left Leaf -->
  <path d="M30 33 C23 30 19 24 20 19 C25 21 28 26 30 33 Z" fill="url(#gold)"/>
  
  <!-- Right Leaf -->
  <path d="M34 33 C41 30 45 24 44 19 C39 21 36 26 34 33 Z" fill="url(#gold)"/>
  
  <!-- Stem -->
  <path d="M32 36 Q32 44 32 47" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Monogram 'SR' in Serif -->
  <text x="32" y="55" font-family="'Cormorant Garamond', Georgia, serif" font-size="9" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="1">SRIRAAJ</text>
</svg>
